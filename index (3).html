<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bible Trivia Live</title><style>
:root{--ink:#08111d;--navy:#0b1829;--gold:#e6b84b;--gold2:#f6d67a;--cream:#f7efd9;--muted:#aeb8c7;--red:#b83a35;--green:#2e9d70}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#263c59 0,#0b1829 42%,#050a11 100%);color:#fff;font-family:Georgia,'Times New Roman',serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.wrap{width:min(1180px,94%);margin:auto}.top{height:74px;border-bottom:1px solid #314157;background:#081321dd;display:flex;align-items:center;justify-content:space-between;padding:0 3%;position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}.logo{font-weight:900;letter-spacing:2px;color:var(--gold2)}.pill{border:1px solid #6e5928;border-radius:99px;padding:8px 13px;color:var(--gold2);font-size:12px;letter-spacing:1px}.hero{min-height:calc(100vh - 74px);display:grid;place-items:center;text-align:center;padding:50px 0}.cross{font-size:54px;color:var(--gold);text-shadow:0 0 30px #e6b84b44}.hero h1{font-size:clamp(48px,8vw,92px);margin:10px 0 0;letter-spacing:1px}.hero h1 span{color:var(--gold2)}.hero p{color:var(--muted);font:18px Arial,sans-serif;max-width:650px;margin:15px auto 35px}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:14px 21px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#15110a;font-weight:900}.btn.dark{background:#16263b;color:#fff;border:1px solid #34485f}.btn.red{background:#742d2a;color:#fff}.screen{padding:28px 0 50px}.grid{display:grid;grid-template-columns:1fr 320px;gap:18px}.panel{background:linear-gradient(145deg,#101f33ee,#091423ee);border:1px solid #2b3c53;border-radius:22px;padding:25px;box-shadow:0 20px 60px #0005}.qmeta{display:flex;justify-content:space-between;color:#9eabc0;font:700 12px Arial,sans-serif;letter-spacing:1px}.question{font-size:clamp(30px,4.5vw,58px);line-height:1.08;margin:45px 0 20px}.timer{font:900 100px Arial,sans-serif;color:var(--gold2);text-align:center;text-shadow:0 0 35px #e6b84b66}.status{text-align:center;font:800 14px Arial,sans-serif;color:#9eabc0;min-height:22px}.answer{margin:20px auto;padding:20px;border-radius:15px;background:#17382d;border:1px solid #3b9e77;text-align:center}.answer small{display:block;color:#8fe1bf;font:800 12px Arial}.answer b{display:block;font-size:30px;margin-top:6px}.team{background:#101f32;border:1px solid #293c55;border-radius:14px;padding:14px;margin:10px 0;font-family:Arial}.team.win{border-color:var(--gold);box-shadow:0 0 22px #e6b84b22}.team strong{display:block}.team span{color:#8fa0b7;font-size:13px}.score{font-size:26px;color:var(--gold2);font-weight:900}.buzzbox{text-align:center}.buzz{width:min(330px,80vw);height:min(330px,80vw);border-radius:50%;border:12px solid #1c3048;background:radial-gradient(circle,#ffe08a,#e6b84b);font:bold 50px Arial;color:#17130a;box-shadow:0 0 70px #e6b84b55}.buzz:disabled{filter:grayscale(1);opacity:.5;box-shadow:none}.field{display:grid;gap:10px;max-width:500px;margin:25px auto}.field input,.field select{padding:15px;border-radius:10px;border:1px solid #3a4b60;background:#0c1a2b;color:#fff}.admin-grid{display:grid;grid-template-columns:300px 1fr;gap:18px}.list{max-height:650px;overflow:auto}.item{padding:12px;border-bottom:1px solid #27384e;font-family:Arial;font-size:14px}.item b{display:block;margin-bottom:5px}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#101f33;border:1px solid #3a4d66;border-radius:12px;padding:12px 18px;z-index:20;font-family:Arial}.small{font:13px Arial;color:#8fa0b7}@media(max-width:850px){.grid,.admin-grid{grid-template-columns:1fr}.question{margin-top:30px}.timer{font-size:76px}}
</style></head><body>
<header class="top"><div class="logo">✦ BIBLE TRIVIA LIVE</div><div id="roomPill" class="pill">READY</div></header>
<div id="app"></div><div id="toast" class="toast hidden"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const FIREBASE_CONFIG={apiKey:"AIzaSyBLhv4C_qBBjh0ghzZuZoVZODI7Dt9pykw",authDomain:"bible-trivia-live-27f14.firebaseapp.com",databaseURL:"https://bible-trivia-live-27f14-default-rtdb.firebaseio.com/",projectId:"bible-trivia-live-27f14",storageBucket:"bible-trivia-live-27f14.firebasestorage.app",messagingSenderId:"962622919690",appId:"1:962622919690:web:288b4dad624cc30653fbf3"};
let db=null,gameCode=null,gameRef=null,questions=[];const $=s=>document.querySelector(s);const toast=m=>{let t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)};
function firebaseReady(){return FIREBASE_CONFIG.apiKey.startsWith('PASTE_')===false}function initFirebase(){if(!firebaseReady()){toast('Add your Firebase config first');return false}if(!db){firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database()}return true}
async function loadQuestions(){try{let r=await fetch('questions.json');questions=await r.json()}catch(e){questions=[]}}
function home(){app.innerHTML=`<main class="hero wrap"><div><div class="cross">✦</div><div class="pill">LIVE SCRIPTURE CHALLENGE</div><h1>BIBLE <span>TRIVIA</span></h1><p>A fast-paced biblical quiz for teams, churches, youth groups and events. One host. Multiple phones. One winner.</p><div class="actions"><button class="btn" onclick="host()">🎤 HOST A GAME</button><button class="btn dark" onclick="join()">⚡ JOIN GAME</button></div></div></main>`}
function host(){gameCode=Math.floor(1000+Math.random()*9000).toString();if(!initFirebase())return; app.innerHTML=`<main class="screen wrap"><div class="grid"><section class="panel"><div class="qmeta"><span id="qnum">QUESTION 1</span><span id="cat">BIBLE</span></div><div class="field" style="margin:15px 0"><label class="small">QUESTION CATEGORY</label><select id="category" onchange="changeCategory()"><option value="ALL">All Questions</option></select></div><div id="question" class="question">Loading questions...</div><div id="timer" class="timer">5</div><div id="status" class="status">Ready to begin</div><div id="answer" class="answer hidden"><small>CORRECT ANSWER</small><b id="answerText"></b></div><div class="actions"><button class="btn" onclick="startRound()">START 5-SECOND ROUND</button><button class="btn dark" onclick="reveal()">REVEAL ANSWER</button><button class="btn red" onclick="nextQ()">NEXT QUESTION</button></div><div class="actions" style="margin-top:14px"><button class="btn dark" onclick="award(1)">+1 POINT</button><button class="btn" onclick="award(2)">+2 POINTS</button><button class="btn red" onclick="penalize()">WRONG / RELEASE BUZZER</button></div><p class="small" style="margin-top:14px">After a wrong answer, the same team is locked out and the remaining teams can buzz.</p></section><aside class="panel"><h2>GAME PIN</h2><div style="font:900 52px Arial;color:var(--gold2)">${gameCode}</div><p class="small">Players join with this PIN.</p><hr style="border-color:#26394f"><h2>TEAMS</h2><div id="teams"></div></aside></div></main>`;loadQuestions().then(()=>{populateCategories();createGame()})}
function createGame(){let data={code:gameCode,qIndex:0,active:false,winner:null,selectedWinner:null,revealed:false,locked:{},category:"ALL",currentQuestion:null,currentAnswer:null,teams:{},scores:{}};if(db){gameRef=db.ref('games/'+gameCode);gameRef.set(data);listenHost()}else{renderHostLocal(data)}}
function listenHost(){gameRef.on('value',s=>renderHost(s.val()||{}))}function renderHost(g){let q=g.currentQuestion||questions[g.qIndex||0];if(q){$('#question').textContent=q.q;$('#answerText').textContent=g.currentAnswer||q.a;$('#qnum').textContent='QUESTION '+((g.qIndex||0)+1);$('#cat').textContent=(q.c||g.category||'BIBLE').toUpperCase()}$('#status').textContent=g.selectedWinner?(g.teams[g.selectedWinner]?.name+' SELECTED FOR POINTS'):g.winner?(g.teams[g.winner]?.name+' BUZZED FIRST'):g.active?'BUZZ NOW!':'Ready';let arr=Object.entries(g.teams||{});$('#teams').innerHTML=arr.length?arr.map(([id,t])=>`<div class="team ${g.winner===id?'win':''}"><strong>${t.name}</strong><span>${g.winner===id?'🏆 FIRST BUZZ':g.locked?.[id]?'❌ LOCKED OUT':'CONNECTED'} · <b class="score">${t.score||0}</b></span>${g.active&&!g.locked?.[id]?`<button class="btn dark" style="margin-top:8px;padding:8px 12px" onclick="selectWinner('${id}')">SELECT WINNER</button>`:''}</div>`).join(''):'<p class="small">Waiting for teams…</p>'}
let timer=null;function startRound(){if(!gameRef)return;gameRef.update({active:true,winner:null,selectedWinner:null,revealed:false,locked:{}});let n=5;$('#timer').textContent=n;clearInterval(timer);timer=setInterval(()=>{n--;$('#timer').textContent=n;if(n<=0){clearInterval(timer);gameRef.update({active:false});beep(250,.35)}else beep(650,.1)},1000);beep(900,.1)}function reveal(){if(gameRef)gameRef.update({revealed:true,active:false});$('#answer').classList.remove('hidden');beep(1100,.3)}function nextQ(){if(!gameRef)return;gameRef.once('value').then(s=>{let g=s.val();let pool=getPool(g.category||'ALL');let next=((g.qIndex||0)+1)%Math.max(pool.length,1);let q=pool[next]||questions[0];gameRef.update({qIndex:next,active:false,winner:null,selectedWinner:null,revealed:false,locked:{},currentQuestion:q,currentAnswer:q?.a||''});$('#answer').classList.add('hidden');$('#timer').textContent='5'})}function selectWinner(id){if(!gameRef)return;gameRef.update({selectedWinner:id,active:false});toast((document.querySelector(`[onclick="selectWinner(\'${id}\')"]`)||{}).textContent||'Winner selected')}function award(points){if(!gameRef)return;gameRef.once('value').then(s=>{let g=s.val();let id=g.selectedWinner||g.winner;if(!id)return toast('Select a team first');gameRef.child('teams/'+id+'/score').set((g.teams[id].score||0)+points);toast('Points awarded')})}function penalize(){if(!gameRef)return;gameRef.once('value').then(s=>{let g=s.val();let id=g.winner;if(!id)return toast('No team has buzzed');gameRef.update({active:true,winner:null,selectedWinner:null,[`locked/${id}`]:true});toast('Wrong — buzzer released for remaining teams')})}function getPool(cat){return cat==='ALL'?questions:questions.filter(q=>(q.c||'BIBLE')===cat)}function populateCategories(){let cats=[...new Set(questions.map(q=>q.c||'BIBLE'))];let el=$('#category');if(el)el.innerHTML=`<option value="ALL">All Questions</option>`+cats.map(c=>`<option value="${c}">${c}</option>`).join('')}function changeCategory(){let cat=$('#category').value;if(!gameRef)return;let pool=getPool(cat);let q=pool[0];gameRef.update({category:cat,qIndex:0,currentQuestion:q||null,currentAnswer:q?.a||null,active:false,winner:null,selectedWinner:null,revealed:false,locked:{}})}
function join(){app.innerHTML=`<main class="hero wrap"><div><div class="pill">PLAYER BUZZER</div><h1>JOIN <span>GAME</span></h1><div class="field"><input id="pin" placeholder="Game PIN" inputmode="numeric"><input id="team" placeholder="Team name"><button class="btn" onclick="joinGame()">JOIN & BUZZ</button></div><p class="small">Keep this page open. The question and answer will appear here when the host reveals them.</p></div></main>`}
let playerId=localStorage.getItem('btl_player')||crypto.randomUUID();localStorage.setItem('btl_player',playerId);function joinGame(){let pin=$('#pin').value.trim(),name=$('#team').value.trim();if(!pin||!name)return toast('Enter PIN and team name');if(!initFirebase())return;gameCode=pin;gameRef=db.ref('games/'+pin);gameRef.once('value').then(s=>{if(!s.exists())return toast('Game not found');gameRef.child('teams/'+playerId).set({name,score:0});player(name)})}
function player(name){app.innerHTML=`<main class="screen wrap"><div class="panel"><div class="pill">TEAM: ${name.toUpperCase()}</div><div id="pquestion" class="question" style="font-size:clamp(28px,6vw,52px)">Waiting for host…</div><div id="panswer" class="answer hidden"><small>CORRECT ANSWER</small><b id="panswerText"></b></div><div id="pstatus" class="status">Waiting for host…</div><div class="buzzbox" style="margin-top:25px"><button id="buzz" class="buzz" onclick="buzz()">BUZZ!</button></div><p class="small" style="text-align:center">Game PIN: ${gameCode}</p></div></main>`;gameRef.on('value',s=>{let g=s.val()||{},b=$('#buzz');if(!b)return;if(g.winner||g.locked?.[playerId])b.disabled=true;else b.disabled=!g.active;$('#pquestion').textContent=g.currentQuestion?.q||'Waiting for host…';$('#panswerText').textContent=g.currentAnswer||'';$('#panswer').classList.toggle('hidden',!g.revealed);$('#pstatus').textContent=g.selectedWinner?(g.selectedWinner===playerId?'🏆 YOUR TEAM WAS SELECTED!':'🏆 A TEAM WAS SELECTED'):g.winner?(g.winner===playerId?'🏆 YOU BUZZED FIRST!':'🔴 ANOTHER TEAM BUZZED FIRST'):g.active?'⚡ BUZZ NOW!':'Waiting for host…'})}
function buzz(){if(!gameRef)return;gameRef.child('winner').transaction(v=>v===null?playerId:v).then(()=>beep(1200,.3))}
function admin(){app.innerHTML=`<main class="screen wrap"><div class="panel"><div class="qmeta"><span>QUESTION BANK</span><span>PDF IMPORT</span></div><h1>Scripture Question Library</h1><p class="small">The supplied PDF has been converted into the included questions.json file. You can also load your own JSON/CSV for a game.</p><div class="actions"><label class="btn dark">IMPORT JSON/CSV <input id="file" type="file" accept=".json,.csv" style="display:none" onchange="importQuestions(event)"></label><button class="btn" onclick="downloadQuestions()">DOWNLOAD QUESTIONS.JSON</button><button class="btn dark" onclick="home()">BACK</button></div><div id="list" class="list" style="margin-top:20px"></div></div></main>`;renderList()}
function renderList(){let list=$('#list');if(!list)return;list.innerHTML=questions.map((x,i)=>`<div class="item"><b>${i+1}. ${x.q}</b><span>${x.a} · ${x.c||'Bible'}</span></div>`).join('')}
function importQuestions(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let text=r.result;let data=f.name.endsWith('.json')?JSON.parse(text):text.split(/\r?\n/).slice(1).filter(Boolean).map(l=>{let p=l.split(',');return{q:p[0].replace(/^"|"$/g,''),a:p[1]?.replace(/^"|"$/g,''),c:p[2]?.replace(/^"|"$/g,'')||'Bible'}});questions=data;renderList();toast(data.length+' questions loaded')}catch(e){toast('Could not read file')}};r.readAsText(f)}function downloadQuestions(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(questions,null,2)],{type:'application/json'}));a.download='questions.json';a.click()}
function beep(f,d){try{let C=AudioContext||webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
loadQuestions().then(home);
</script></body></html>
